<svg
  width="100%"
  height="220"
  viewBox="0 0 854 220"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Medy B. Villarias - Full-Stack Systems &amp; Software Engineer"
>
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080612"/>
      <stop offset="45%" stop-color="#140E2A"/>
      <stop offset="100%" stop-color="#241442"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#080612" stop-opacity="0"/>
    </radialGradient>

    <!-- Wave Gradients -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E1238" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#2D1A54" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1E1238" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B1C6E" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#6D28D9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2A144E" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#DDD6FE"/>
    </linearGradient>

    <!-- Dot Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#7C3AED" fill-opacity="0.18"/>
    </pattern>

    <!-- Text Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .role-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .sub-tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.8px;
    }
  </style>

  <!-- Base Background -->
  <rect width="854" height="220" fill="url(#bgGradient)"/>

  <!-- Subtle Dot Grid Background -->
  <rect width="854" height="175" fill="url(#dotGrid)"/>

  <!-- Radial Glow Behind Name -->
  <rect width="854" height="220" fill="url(#centerGlow)"/>

  <!-- Layered Waves at Bottom -->
  <!-- Deep Background Wave -->
  <path
    d="M0 0 L0 160 Q 213 195 427 165 T 854 180 L 854 0 Z"
    fill="url(#wave1)"
    opacity="0.85"
  />

  <!-- Middle Wave with Accent Opacity -->
  <path
    d="M0 0 L0 142 Q 213 180 427 150 T 854 165 L 854 0 Z"
    fill="url(#wave2)"
  />

  <!-- Glowing Accent Curve -->
  <path
    d="M0 142 Q 213 180 427 150 T 854 165"
    fill="none"
    stroke="url(#glowLine)"
    stroke-width="2.5"
  />

  <!-- Top Decorative Corner Accents -->
  <path d="M12 24 L12 12 L24 12" fill="none" stroke="#8B5CF6" stroke-width="2" opacity="0.6"/>
  <path d="M842 24 L842 12 L830 12" fill="none" stroke="#8B5CF6" stroke-width="2" opacity="0.6"/>

  <!-- Main Headline: Medy B. Villarias -->
  <g filter="url(#shadow)">
    <text
      x="427"
      y="84"
      text-anchor="middle"
      class="name-title"
      fill="url(#textGrad)"
    >Medy B. Villarias</text>
  </g>

  <!-- Subtitle: Role & Core Specialty -->
  <text
    x="427"
    y="120"
    text-anchor="middle"
    class="role-title"
    fill="#C4B5FD"
  >Full-Stack Systems &amp; Software Engineer</text>

    <!-- High-Tech Badge Strip with Heroicons -->
  <g transform="translate(427, 155)">
    <!-- Pill 1: Systems Architecture -->
    <rect x="-240" y="-12" width="145" height="24" rx="12" fill="#1A1233" stroke="#6D28D9" stroke-width="1" opacity="0.85"/>
    <g transform="translate(-230, -7.5) scale(0.62)">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M14.6152 1.59492C14.9164 1.76287 15.0643 2.1146 14.9736 2.44734L12.9819 9.75H20.25C20.5486 9.75 20.8188 9.92718 20.9378 10.2011C21.0569 10.475 21.0021 10.7934 20.7983 11.0117L10.2983 22.2617C10.063 22.5139 9.68601 22.573 9.38478 22.4051C9.08354 22.2371 8.93567 21.8854 9.02641 21.5527L11.018 14.25H3.74999C3.45134 14.25 3.18115 14.0728 3.06213 13.7989C2.9431 13.525 2.99792 13.2066 3.20169 12.9883L13.7017 1.73826C13.937 1.48613 14.314 1.42698 14.6152 1.59492Z" fill="#A78BFA"/>
    </g>
    <text x="-156" y="4.5" text-anchor="middle" class="sub-tag" fill="#E9D5FF">ARCHITECTURE</text>

    <!-- Pill 2: Relational Databases -->
    <rect x="-80" y="-12" width="160" height="24" rx="12" fill="#1A1233" stroke="#6D28D9" stroke-width="1" opacity="0.85"/>
    <g transform="translate(-70, -7.5) scale(0.62)">
      <path d="M21 6.375C21 9.06739 16.9706 11.25 12 11.25C7.02944 11.25 3 9.06739 3 6.375C3 3.68261 7.02944 1.5 12 1.5C16.9706 1.5 21 3.68261 21 6.375Z" fill="#A78BFA"/>
      <path d="M12 12.75C14.6852 12.75 17.1905 12.1637 19.0784 11.1411C19.7684 10.7673 20.4248 10.3043 20.9747 9.75674C20.9915 9.87831 21 10.0011 21 10.125C21 12.8174 16.9706 15 12 15C7.02944 15 3 12.8174 3 10.125C3 10.0011 3.00853 9.8783 3.02529 9.75674C3.57523 10.3043 4.23162 10.7673 4.92161 11.1411C6.80949 12.1637 9.31481 12.75 12 12.75Z" fill="#A78BFA"/>
      <path d="M12 16.5C14.6852 16.5 17.1905 15.9137 19.0784 14.8911C19.7684 14.5173 20.4248 14.0543 20.9747 13.5067C20.9915 13.6283 21 13.7511 21 13.875C21 16.5674 16.9706 18.75 12 18.75C7.02944 18.75 3 16.5674 3 13.875C3 13.7511 3.00853 13.6283 3.02529 13.5067C3.57523 14.0543 4.23162 14.5173 4.92161 14.8911C6.80949 15.9137 9.31481 16.5 12 16.5Z" fill="#A78BFA"/>
      <path d="M12 20.25C14.6852 20.25 17.1905 19.6637 19.0784 18.6411C19.7684 18.2673 20.4248 17.8043 20.9747 17.2567C20.9915 17.3783 21 17.5011 21 17.625C21 20.3174 16.9706 22.5 12 22.5C7.02944 22.5 3 20.3174 3 17.625C3 17.5011 3.00853 17.3783 3.02529 17.2567C3.57523 17.8043 4.23162 18.2673 4.92161 18.6411C6.80949 19.6637 9.31481 20.25 12 20.25Z" fill="#A78BFA"/>
    </g>
    <text x="10" y="4.5" text-anchor="middle" class="sub-tag" fill="#E9D5FF">RELATIONAL DB</text>

    <!-- Pill 3: Production Engineering -->
    <rect x="95" y="-12" width="145" height="24" rx="12" fill="#1A1233" stroke="#6D28D9" stroke-width="1" opacity="0.85"/>
    <g transform="translate(105, -7.5) scale(0.62)">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M9.315 7.58365C12.1956 3.88296 16.6946 1.50021 21.75 1.5C21.9489 1.49999 22.1397 1.57901 22.2803 1.71966C22.421 1.86031 22.5 2.05108 22.5 2.25C22.5 7.30564 20.1173 11.805 16.4165 14.6859C16.4715 15.0329 16.5 15.3883 16.5 15.75C16.5 19.4779 13.4779 22.5 9.75 22.5C9.33579 22.5 9 22.1642 9 21.75V17.6185C8.99075 17.6118 8.98163 17.6049 8.97264 17.5978C8.02063 16.8429 7.15799 15.9803 6.40312 15.0282C6.39577 15.019 6.38866 15.0096 6.38179 15H2.25C1.83579 15 1.5 14.6642 1.5 14.25C1.5 10.5221 4.52208 7.5 8.25 7.5C8.61198 7.5 8.96772 7.52856 9.315 7.58365ZM15 6.75C13.7574 6.75 12.75 7.75736 12.75 9C12.75 10.2426 13.7574 11.25 15 11.25C16.2426 11.25 17.25 10.2426 17.25 9C17.25 7.75736 16.2426 6.75 15 6.75Z" fill="#A78BFA"/>
      <path d="M5.26036 17.2418C5.59237 16.9942 5.66074 16.5242 5.41306 16.1922C5.16539 15.8602 4.69546 15.7918 4.36345 16.0395C3.08209 16.9954 2.25 18.5256 2.25 20.2499C2.25 20.5255 2.27129 20.7966 2.31246 21.0615C2.36259 21.3842 2.61574 21.6373 2.93842 21.6875C3.20336 21.7286 3.47445 21.7499 3.75 21.7499C5.47434 21.7499 7.00452 20.9178 7.9604 19.6365C8.20808 19.3045 8.13971 18.8345 7.8077 18.5869C7.47569 18.3392 7.00576 18.4075 6.75809 18.7396C6.07313 19.6577 4.98081 20.2499 3.75 20.2499C3.75 19.0191 4.34218 17.9268 5.26036 17.2418Z" fill="#A78BFA"/>
    </g>
    <text x="178" y="4.5" text-anchor="middle" class="sub-tag" fill="#E9D5FF">PRODUCTION</text>
  </g>
</svg>
